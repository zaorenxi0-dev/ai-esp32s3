<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>配置成功</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f2f4f7;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            max-height: 100vh;
            box-sizing: border-box;
            padding: 20px;
        }

        .checkmark {
            width: 150px;
            height: 150px;
            margin-bottom: 30px;
        }

        .message {
            text-align: center;
            font-size: 20px;
            color: #1f2329;
            margin-bottom: 12px;
        }

        .sub {
            text-align: center;
            font-size: 13px;
            color: #8a919e;
        }
    </style>
</head>
<body>
    <div class="container">
        <svg class="checkmark" viewBox="0 0 52 52">
            <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none" stroke="#4CAF50" stroke-width="2"/>
            <path class="checkmark__check" fill="none" stroke="#4CAF50" stroke-width="2" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
        </svg>

        <div class="message">
            <p>配置成功！</p>
            <p>Configuration successful!</p>
        </div>
        <div class="sub">设备正在退出配网模式，请稍候…</div>
    </div>

    <script>
        window.addEventListener('load', function() {
            // 延迟一点再通知设备退出配网模式，确保页面已经渲染出来
            setTimeout(function() {
                fetch('/exit', { method: 'POST' })
                    .then(function(response) {
                        if (response.ok) {
                            console.log('Exit config mode request sent');
                        } else {
                            console.error('Failed to send exit request');
                        }
                    })
                    .catch(function(error) {
                        console.error('Error:', error);
                    });
            }, 1500);
        });
    </script>
</body>
</html>
